name: Test Manual Checkout

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test-checkout:
    runs-on: self-hosted

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout code manually
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=== Manual checkout started ==="
          Write-Host "Repository: $env:GITHUB_REPOSITORY"
          Write-Host "Branch: $env:BRANCH_NAME"
          Write-Host "Commit SHA: $env:GITHUB_SHA"
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"

          git --version

          $repoDir = Join-Path $env:GITHUB_WORKSPACE "_repo"

          if (Test-Path $repoDir) {
            Write-Host "Old _repo folder exists. Removing it..."
            Remove-Item -LiteralPath $repoDir -Recurse -Force
          }

          $repoUrl = "https://github.com/$env:GITHUB_REPOSITORY.git"

          Write-Host "Cloning repository into: $repoDir"

          git -c http.extraheader="AUTHORIZATION: bearer $env:GH_TOKEN" clone --depth 1 --branch $env:BRANCH_NAME $repoUrl $repoDir

          Set-Location $repoDir

          Write-Host "Checking out exact commit..."
          git checkout --force $env:GITHUB_SHA

          Write-Host "Current git status:"
          git status

          Write-Host "Files:"
          Get-ChildItem

          Write-Host "=== Manual checkout finished successfully ==="

      - name: Check project files
        working-directory: _repo
        run: |
          Write-Host "Now we are inside downloaded project:"
          Get-ChildItem