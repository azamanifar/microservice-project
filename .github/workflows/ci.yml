name: Test Manual Checkout

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test-checkout:
    runs-on: self-hosted

    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout code manually
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo === Manual checkout started ===
          echo Repository: %GITHUB_REPOSITORY%
          echo Workspace: %GITHUB_WORKSPACE%
          echo Commit: %GITHUB_SHA%

          git --version

          cd /d "%GITHUB_WORKSPACE%"

          if exist "_repo" (
            echo Old _repo folder exists. Removing it...
            rmdir /s /q "_repo"
          )

          echo Cloning repository...
          git -c http.extraheader="AUTHORIZATION: bearer %GH_TOKEN%" clone --depth 1 https://github.com/%GITHUB_REPOSITORY%.git "_repo"

          if errorlevel 1 (
            echo Git clone failed
            exit /b 1
          )

          cd /d "_repo"

          echo Checking out exact commit...
          git checkout --force %GITHUB_SHA%

          if errorlevel 1 (
            echo Direct checkout failed. Trying fetch exact commit...
            git fetch --depth 1 origin %GITHUB_SHA%
            git checkout --force FETCH_HEAD
          )

          if errorlevel 1 (
            echo Git checkout failed
            exit /b 1
          )

          echo Current git status:
          git status

          echo Files in project:
          dir

          echo === Manual checkout finished successfully ===