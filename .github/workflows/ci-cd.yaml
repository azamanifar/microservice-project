name: CI-CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    permissions:
      contents: read

    #  فقط DOCKER_HOST رو ست کنید
    env:
      DOCKER_HOST: npipe:////./pipe/dockerDesktopLinuxEngine

    defaults:
      run:
        shell: powershell

    steps:
      - name: Clean old source
        run: |
          if (Test-Path ".\source") {
            Remove-Item ".\source" -Recurse -Force
          }

      - name: Checkout code manually
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $cloneUrl = "https://x-access-token:${env:GH_TOKEN}@github.com/${env:GITHUB_REPOSITORY}.git"
          git clone --depth 1 --branch "${env:GITHUB_REF_NAME}" $cloneUrl source

      # 🔥 مرحله جدید: تنظیم Docker Host
      - name: Setup Docker
        run: |
          Write-Host "========================================" -ForegroundColor Cyan
          Write-Host "Setting up Docker..." -ForegroundColor Yellow
          Write-Host "========================================" -ForegroundColor Cyan
          
          # تنظیم DOCKER_HOST
          $env:DOCKER_HOST = "npipe:////./pipe/dockerDesktopLinuxEngine"
          
          # تست Docker
          docker version
          docker info
          
          Write-Host "========================================" -ForegroundColor Green
          Write-Host "Docker Setup Complete!" -ForegroundColor Green
          Write-Host "========================================" -ForegroundColor Green
        env:
          DOCKER_HOST: npipe:////./pipe/dockerDesktopLinuxEngine

      - name: Check tools
        run: |
          Set-Location ".\source"
          
          Write-Host "========================================" -ForegroundColor Cyan
          Write-Host "Checking Tools..." -ForegroundColor Yellow
          Write-Host "========================================" -ForegroundColor Cyan
          
          java -version
          docker version
          kubectl version --client
          kubectl config current-context
        env:
          DOCKER_HOST: npipe:////./pipe/dockerDesktopLinuxEngine

      - name: Build with Maven
        run: |
          Set-Location ".\source"
          if (Test-Path ".\mvnw.cmd") {
            .\mvnw.cmd clean package -DskipTests
          } else {
            mvn clean package -DskipTests
          }

      - name: Build Docker Image
        run: |
          Set-Location ".\source"
          docker build -t product-service:latest .
        env:
          DOCKER_HOST: npipe:////./pipe/dockerDesktopLinuxEngine

      - name: Apply Kubernetes Deployment
        run: |
          Set-Location ".\source"
          kubectl apply -f k8s/deployment.yaml

      - name: Restart Deployment in Kubernetes
        run: |
          Set-Location ".\source"
          kubectl rollout restart deployment/product-service
          kubectl rollout status deployment/product-service --timeout=180s
          kubectl get pods -l app=product-service